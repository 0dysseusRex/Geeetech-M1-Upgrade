# Geeetech M1 — first draft. Not calibrated. Do not heat until the
# DRAFT sensor types below are replaced with the real ones.
#
# Host: Mellow Fly-Pi-lite2.1 (Fly Lite 2.1) on Fly-bian Simple-AF.
# The Lite is a Klipper host, not a stepper board. Mellow documents one
# host GPIO for Klipper, and only for a KPPM module:
#   host:gpiochip1/gpio8
# https://mellow.klipper.cn/en/docs/ProductDoc/SBC/fly-lite/lite2.1/advanced/kppm/
# This printer config does not load that pin. Do not copy a Fly-Pi 40-pin
# map onto the Lite; Mellow does not publish one for this board.
# https://github.com/0dysseusRex/fly-bian/blob/main/docs/klipper-pins-and-macros.md
#
# Motion MCU: BTT SKR Pico, still the mainboard in this repo. Pin names
# below are the SKR Pico connectors from Klipper's generic config:
# https://github.com/Klipper3d/klipper/blob/master/config/generic-bigtreetech-skr-pico-v1.0.cfg
# Compile that MCU for the RP2040 with USB. "make flash" does not work;
# copy out/klipper.uf2 to the board in boot mode.
#
# Toolhead in this repo: A1 Mini hotend, Creality K1 extruder, BTT
# Microprobe, fan mounts. Motors, endstops, and the first home are the
# original M1. The Microprobe is not the homing endstop.
#
# Build volume from the Geeetech M1 wiki: 100 x 110 x 100 mm.
# http://wiki.geeetech.com/index.php/Geeetech_M1_3D_printer
# Nozzle max 230 C, bed max 60 C, 1.75 mm filament, 0.4 mm nozzle.
# Geeetech staff have also said to set the slicer bed to 100 x 100 mm.
#
# Lines marked DRAFT are placeholders. This repo and the sources above
# do not give those values.

[mcu]
# DRAFT: replace with the SKR Pico path from `ls /dev/serial/by-id/`.
# Reject usb-1a86_USB_Serial (the Lite's Type-C UART) and anything
# with katapult in the name.
serial: /dev/serial/by-id/usb-Klipper_rp2040_DRAFT_SKR_PICO-if00

# [mcu host] is not included. Fly-bian only creates /tmp/klipper_host_mcu
# after the Linux MCU is running, and nothing in this file uses a host pin.
# Uncomment the two lines below only if you add the KPPM pin later.
# [mcu host]
# serial: /tmp/klipper_host_mcu

# The Mellow ADXL345 is a USB board. Leave this commented out so Klipper
# starts with the accelerometer unplugged. See adxl345.cfg.
# [include adxl345.cfg]

[printer]
kinematics: cartesian
# 250 mm/s is the wiki's published maximum print speed, not a measured limit.
max_velocity: 250
# DRAFT PLACEHOLDER. The M1 wiki does not publish acceleration.
max_accel: 1000
# DRAFT PLACEHOLDER.
max_z_velocity: 5
# DRAFT PLACEHOLDER.
max_z_accel: 100

[stepper_x]
step_pin: gpio11
# DRAFT: the "!" is the SKR Pico sample polarity, not checked on this M1.
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
# DRAFT PLACEHOLDER. Not measured. The SKR Pico sample uses 40.
rotation_distance: 40
# SKR Pico X endstop connector. Pull-up from the sample. DRAFT polarity.
endstop_pin: ^gpio4
# DRAFT: original M1 firmware with a home corner was not found.
# This homes toward minimum on the mechanical endstop, not the probe.
position_endstop: 0
position_max: 100
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
# DRAFT PLACEHOLDER. Sample current, not measured for the stock motor.
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: gpio6
# DRAFT: sample polarity.
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
# DRAFT PLACEHOLDER. Not measured.
rotation_distance: 40
endstop_pin: ^gpio3
# DRAFT: same unverified min-endstop assumption as X.
position_endstop: 0
position_max: 110
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
# DRAFT PLACEHOLDER.
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: gpio19
# DRAFT: sample polarity. The generic file does not invert Z.
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
# DRAFT PLACEHOLDER. Lead-screw pitch is not in the M1 wiki.
# The SKR Pico sample uses 8. Do not trust travel until this is measured.
rotation_distance: 8
# Mechanical Z endstop. Do not change this to probe:z_virtual_endstop.
endstop_pin: ^gpio25
position_endstop: 0
position_max: 100
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
# DRAFT PLACEHOLDER.
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
# DRAFT: sample polarity. Creality K1 direction is not recorded here.
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
# DRAFT PLACEHOLDER. Creality K1 rotation_distance is not in this repo.
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
# DRAFT PLACEHOLDER. A1 Mini thermistor type is not identified.
# Do not heat the hotend until this is replaced.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
# watermark avoids invented PID gains. Run PID_CALIBRATE before printing.
control: watermark
min_temp: 0
# Wiki maximum extruder temperature.
max_temp: 230

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
# DRAFT PLACEHOLDER. Not a measured K1 extruder current.
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
# DRAFT PLACEHOLDER. The stock M1 bed thermistor is not identified.
# Do not heat the bed until this is replaced.
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: watermark
min_temp: 0
# Wiki maximum hot-bed temperature.
max_temp: 60

# DRAFT: which toolhead fan lands on which SKR Pico fan pin is not documented.
# gpio17 and gpio18 are the sample part-cooling and hotend-fan connectors.
[fan]
pin: gpio17

[heater_fan hotend_fan]
pin: gpio18
heater: extruder
heater_temp: 50.0

# BTT MicroProbe on the SKR Pico probe connector from the generic file
# (sensor gpio22, control gpio29). DRAFT: this repo does not show that wiring.
# V1 triggers high (^). V2 triggers low (^!). Version is not recorded here.
# Manual: https://lemontron.com/assets/downloads/biqu-microprobe-manual.pdf
[output_pin probe_enable]
pin: gpio29
value: 0

[probe]
pin: ^gpio22
deactivate_on_each_sample: False
# DRAFT PLACEHOLDER. Mount offsets are not measured.
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0
speed: 5.0
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0

[bed_mesh]
speed: 50
# DRAFT PLACEHOLDER.
horizontal_move_z: 5
# DRAFT inset. With a 0,0 probe offset these stay inside 100 x 110.
mesh_min: 10, 10
mesh_max: 90, 100
probe_count: 3, 3
algorithm: bicubic

[gcode_macro START_PRINT]
description: Home on the endstops, then mesh with the Microprobe
gcode:
    {% set BED_TEMP = params.BED_TEMP|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    G28
    # G28 used the mechanical endstops. The Microprobe did not home Z.
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    # Mesh moves use [probe] z_offset. Calibrate that once with PROBE_CALIBRATE.
    G1 Z5 F300

[gcode_macro END_PRINT]
gcode:
    M140 S0
    M104 S0
    M106 S0
    G91
    G1 Z5 F300
    G90
