# Mellow Fly-ADXL345-USB. Include this only while the board is plugged in.
# Do not put [include adxl345.cfg] in the printer.cfg that Simple-AF installs
# from. That installer rejects includes. After install, add the include to
# the installed printer.cfg only for an input-shaping run, then remove it.
# Klipper will not start if this file is included and the USB MCU is missing.
#
# These pins are the RP2040 on the USB accelerometer, not Fly Lite SoC pins.
# The Lite 2.1 cannot drive a bare SPI/I2C ADXL345:
# https://mellow.klipper.cn/en/docs/ProductDoc/SBC/fly-lite/lite2.1/advanced/adxl/
# Pin names from Mellow's Fly-ADXL345-USB sample:
# https://mellow-3d.github.io/fly_adxl345_usb_klipper_config.html

[mcu adxl]
# DRAFT: replace with `ls /dev/serial/by-id/` while the board is plugged in.
serial: /dev/serial/by-id/usb-Klipper_rp2040_DRAFT_ADXL345-if00

[adxl345]
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12
# axes_map is omitted. Mount orientation on this toolhead is not recorded.
# Klipper's default is x, y, z. Check it with ACCELEROMETER_QUERY before
# trusting SHAPER_CALIBRATE.

[resonance_tester]
accel_chip: adxl345
# DRAFT PLACEHOLDER. Mellow's sample point (150, 150, 20) is outside this
# printer. 57.5, 57 is the middle of the stock M211 travel (115 x 114).
probe_points:
    57.5, 57, 20
