# Geeetech M1 — Simple-AF printer definition. Not calibrated. Do not heat
# until the DRAFT sensor types below are replaced with the real ones.
#
# Host: Mellow Fly-Pi-lite2.1 (Fly Lite 2.1) on Fly-bian Simple-AF.
# The Lite is a Klipper host, not a stepper board. Mellow documents one
# host GPIO for Klipper, and only for a KPPM module:
#   host:gpiochip1/gpio8
# https://mellow.klipper.cn/en/docs/ProductDoc/SBC/fly-lite/lite2.1/advanced/kppm/
# This printer config does not load that pin. Do not copy a Fly-Pi 40-pin
# map onto the Lite; Mellow does not publish one for this board.
# https://github.com/0dysseusRex/fly-bian/blob/main/docs/klipper-pins-and-macros.md
#
# Motion MCU: BTT SKR Pico, still the mainboard in this repo. Pin names
# below are the SKR Pico connectors from Klipper's generic config:
# https://github.com/Klipper3d/klipper/blob/master/config/generic-bigtreetech-skr-pico-v1.0.cfg
# Compile that MCU for the RP2040 with USB. "make flash" does not work;
# copy out/klipper.uf2 to the board in boot mode.
#
# Toolhead in this repo: A1 Mini hotend, Creality K1 extruder, BTT
# Microprobe, fan mounts. Motors, endstops, and the first home are the
# original M1. The Microprobe is not the homing endstop.
#
# X/Y/Z rotation distances, travel, and homing direction are from the stock
# M1S Marlin dump (M92/M201/M203/M211/M119). The M1S is the M1 plus Wi-Fi;
# the mechanics match. Source:
# https://github.com/adamrodgers/geeetech-m1s-klipper
# Their MCU pins are for the stock APM32 board and are not used here.
#
# Advertised volume is 100 x 110 x 100 mm. Stock M211 travel is
# X 0..115, Y 0..114, Z 0..95. Nozzle max 230 C, bed max 60 C.
#
# Simple-AF wants one file. Lines that start with "-- name.cfg" are
# sections it copies into that file. It rejects [include] and SAVE_CONFIG.
# https://pellcorp.github.io/creality-wiki/rpi_printer_definitions/
# Comment lines are dropped on install. The values are not.
#
# Do not add START_PRINT or END_PRINT here. Simple-AF start_end.cfg
# already defines them. Its G28 uses the mechanical endstops below.
# The Microprobe is only for the mesh that start sequence runs after G28.
#
# The Mellow ADXL345 stays out of this file. See adxl345.cfg. Include
# that file only while input shaping is running.
#
# Lines marked DRAFT are placeholders. This repo and the sources above
# do not give those values.

-- printer.cfg
[mcu]
# DRAFT: replace with the SKR Pico path from `ls /dev/serial/by-id/`.
# Reject usb-1a86_USB_Serial (the Lite's Type-C UART) and anything
# with katapult in the name.
serial: /dev/serial/by-id/usb-Klipper_rp2040_DRAFT_SKR_PICO-if00

[printer]
# Cartesian bed slinger: the bed moves in Y. Confirmed on the M1S dump.
kinematics: cartesian
# Stock M203: X 200, Y 200. The wiki's 250 mm/s claim is higher than this.
max_velocity: 200
# Stock M201: X 3000, Y 3000.
max_accel: 3000
# Stock M203 Z.
max_z_velocity: 25
# Stock M201 Z.
max_z_accel: 500

[stepper_x]
step_pin: gpio11
# DRAFT: Pico DIR polarity is not the stock board's. Stock homes to X max.
# If X moves away from the switch, remove or add "!".
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
# Stock M92 X80 at 16 microsteps: 200 * 16 / 80 = 40 (GT2 20-tooth).
rotation_distance: 40
# SKR Pico X endstop connector. DRAFT pull-up polarity.
endstop_pin: ^gpio4
# Stock M119: x_max. M211 max is 115. Homes on the switch, not the probe.
position_endstop: 115
position_max: 115
position_min: 0
homing_speed: 25
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
# Stock M906 X800, stealthChop (M569).
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: gpio6
# DRAFT: Pico DIR polarity. Stock Y homes toward the back (min) endstop.
# Flip "!" if it homes the wrong way.
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
# Stock M92 Y80 at 16 microsteps.
rotation_distance: 40
# SKR Pico Y endstop connector. DRAFT pull-up polarity.
endstop_pin: ^gpio3
# Stock M119: y_min. M211 max is 114. G28 ends at Y0.
position_endstop: 0
position_max: 114
position_min: 0
homing_speed: 25

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
# Stock M906 Y800, stealthChop.
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: gpio19
# DRAFT: Pico DIR polarity. Stock Z homes toward the frame switch (min).
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
# Stock M92 Z830 at 16 microsteps: 200 * 16 / 830 = 3.8554.
# Not a standard 4 mm or 8 mm lead. Confirm on the leadscrew.
rotation_distance: 3.8554
# Mechanical frame switch. Do not change this to probe:z_virtual_endstop.
endstop_pin: ^gpio25
# The M1S config used -0.8 after a paper test on the stock nozzle.
# This toolhead is different, so 0 is only a starting point.
position_endstop: 0
# Stock M211 Z max. Their config allows -2 for switch clearance.
position_min: -2
position_max: 95
homing_speed: 10
second_homing_speed: 2
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
# DRAFT PLACEHOLDER. Stock Z is an A4988, so M906 has no Z current.
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: gpio14
# DRAFT: sample polarity. Creality K1 direction is not recorded here.
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
# DRAFT PLACEHOLDER. Creality K1 rotation_distance is not in this repo.
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
# DRAFT PLACEHOLDER. A1 Mini thermistor type is not identified.
# Do not heat the hotend until this is replaced.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
# watermark avoids invented PID gains. Run PID_CALIBRATE before printing.
control: watermark
min_temp: 0
# Wiki maximum extruder temperature.
max_temp: 230

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
# DRAFT PLACEHOLDER. Not a measured K1 extruder current.
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: gpio21
# DRAFT PLACEHOLDER. The stock M1 bed thermistor is not identified.
# Do not heat the bed until this is replaced.
sensor_type: ATC Semitec 104GT-2
sensor_pin: gpio26
control: watermark
min_temp: 0
# Wiki maximum hot-bed temperature.
max_temp: 60

# DRAFT: which toolhead fan lands on which SKR Pico fan pin is not documented.
# gpio17 and gpio18 are the sample part-cooling and hotend-fan connectors.
[fan]
pin: gpio17

[heater_fan hotend_fan]
pin: gpio18
heater: extruder
heater_temp: 50.0

-- microprobe.cfg
# BTT MicroProbe on the SKR Pico probe connector from the generic file
# (sensor gpio22, control gpio29). DRAFT: this repo does not show that wiring.
# V1 triggers high (^). V2 triggers low (^!). Version is not recorded here.
# Manual: https://lemontron.com/assets/downloads/biqu-microprobe-manual.pdf
# Simple-AF copies its own microprobe.cfg, then patches these keys over it.
[output_pin probe_enable]
pin: gpio29
value: 0

[probe]
pin: ^gpio22
deactivate_on_each_sample: False
# DRAFT PLACEHOLDER. Mount offsets are not measured.
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0
speed: 5.0
activate_gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500
deactivate_gcode:
    SET_PIN PIN=probe_enable VALUE=0

[bed_mesh]
speed: 50
# DRAFT PLACEHOLDER.
horizontal_move_z: 5
# DRAFT inset inside the stock 115 x 114 travel. Probe offset is still 0.
# The stock nozzle mesh covered about 10,10 to 95,100. Move these once the
# Microprobe offset is measured.
mesh_min: 10, 10
mesh_max: 90, 100
probe_count: 3, 3
algorithm: bicubic
